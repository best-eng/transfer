<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Найти поездку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#1c1c1e;--inp:#3a3a3c;--acc:#0a84ff;--txt:#fff;--sub:#aeaeb2;--brd:#48484a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px 16px 100px}
h1{font-size:20px;font-weight:700;margin-bottom:3px;line-height:1.3}
.sub{font-size:13px;color:var(--sub);margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.field input,.field textarea,.field select{width:100%;background:var(--inp);border:1.5px solid var(--brd);border-radius:12px;padding:13px 14px;color:var(--txt);font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--acc)}
.field textarea{resize:none;height:74px}
.seg{display:flex;background:var(--inp);border-radius:12px;padding:3px;gap:3px}
.seg input{display:none}
.seg label{flex:1;min-width:28px;text-align:center;padding:9px 2px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;color:var(--sub);transition:all .15s}
.seg input:checked+label{background:var(--acc);color:#fff}
#calWrap{background:var(--inp);border:1.5px solid var(--brd);border-radius:14px;overflow:hidden}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--brd)}
.cal-head span{font-weight:700;font-size:15px}
.cal-head button{background:none;border:none;color:var(--acc);font-size:26px;line-height:1;cursor:pointer;padding:0 6px;touch-action:manipulation}
.cal-body{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:6px}
.cal-dow{text-align:center;font-size:11px;color:var(--sub);font-weight:600;padding:4px 0}
.cal-d{text-align:center;padding:9px 2px;border-radius:8px;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cal-d.past{color:var(--brd);pointer-events:none}
.cal-d.today{color:var(--acc);font-weight:700}
.cal-d.sel{background:var(--acc);color:#fff}
.cal-foot{padding:8px 14px;font-size:13px;color:var(--sub);border-top:1px solid var(--brd)}
.cal-foot b{color:var(--txt)}
.btn-submit{position:fixed;bottom:0;left:0;right:0;padding:17px;background:var(--acc);color:#fff;border:none;font-size:16px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-submit:active{opacity:.85}
.toast{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:99;border:1px solid #444}
.toast.on{opacity:1}
</style>
</head>
<body>
<h1>🔍 Найти поездку</h1>
<p class="sub">Й-Ола ↔ Казань (центр и аэропорт)</p>
<div class="field"><label>🗺 Маршрут</label><select id="t_route"><option value="">Выберите маршрут</option><option>Йошкар-Ола → Казань (центр)</option><option>Йошкар-Ола → Казань (Аэропорт)</option><option>Казань (центр) → Йошкар-Ола</option><option>Казань (Аэропорт) → Йошкар-Ола</option></select></div><div class="field"><label>📅 Дата поездки</label><div id="calWrap"></div></div><div class="field"><label>🕐 Время выезда</label><input type="time" id="t_time"></div><div class="field"><label>👥 Количество мест</label><div class="seg"><input type="radio" name="t_seats" id="t_seats1" value="1"><label for="t_seats1">1</label><input type="radio" name="t_seats" id="t_seats2" value="2"><label for="t_seats2">2</label><input type="radio" name="t_seats" id="t_seats3" value="3"><label for="t_seats3">3</label><input type="radio" name="t_seats" id="t_seats4" value="4"><label for="t_seats4">4</label><input type="radio" name="t_seats" id="t_seats5" value="5"><label for="t_seats5">5</label><input type="radio" name="t_seats" id="t_seats6" value="6"><label for="t_seats6">6</label><input type="radio" name="t_seats" id="t_seats7" value="7"><label for="t_seats7">7</label><input type="radio" name="t_seats" id="t_seats8" value="8"><label for="t_seats8">8</label></div></div><div class="field"><label>📞 Ваш номер телефона</label><input type="tel" id="t_phone" placeholder="+7 (999) 000-00-00"></div><div class="field"><label>💬 Комментарий (если есть)</label><textarea id="t_com" placeholder="..."></textarea></div>
<button class="btn-submit" id="sbtn">ОТПРАВИТЬ ЗАЯВКУ</button>
<div class="toast" id="toast"></div>
<script>
var tg=window.Telegram.WebApp;tg.ready();tg.expand();

var MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
var calY,calM,calSel=null;
function p2(n){return n<10?'0'+n:String(n)}
function todayMidnight(){var d=new Date();d.setHours(0,0,0,0);return d}
function calDraw(){
  var el=document.getElementById('calWrap');if(!el)return;
  var today=todayMidnight();
  var first=new Date(calY,calM,1);var last=new Date(calY,calM+1,0);
  var dow=first.getDay();dow=dow===0?6:dow-1;
  var h='<div class="cal-head"><button id="cPrev">&#8249;</button><span>'+MONTHS[calM]+' '+calY+'</span><button id="cNext">&#8250;</button></div><div class="cal-body">';
  DOW.forEach(function(d){h+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<dow;i++)h+='<div></div>';
  for(var d=1;d<=last.getDate();d++){
    var dt=new Date(calY,calM,d);var c='cal-d';
    if(dt<today)c+=' past';
    else if(dt.toDateString()===today.toDateString())c+=' today';
    if(calSel&&dt.toDateString()===calSel.toDateString())c+=' sel';
    h+='<div class="'+c+'" data-d="'+d+'">'+d+'</div>';
  }
  h+='</div>';
  var ds=calSel?p2(calSel.getDate())+'.'+p2(calSel.getMonth()+1)+'.'+calSel.getFullYear():'не выбрана';
  h+='<div class="cal-foot">Выбрано: <b>'+ds+'</b></div>';
  el.innerHTML=h;
  document.getElementById('cPrev').addEventListener('click',function(e){e.preventDefault();calM--;if(calM<0){calM=11;calY--;}calDraw();});
  document.getElementById('cNext').addEventListener('click',function(e){e.preventDefault();calM++;if(calM>11){calM=0;calY++;}calDraw();});
  el.querySelectorAll('.cal-d:not(.past)').forEach(function(cell){
    cell.addEventListener('click',function(){
      var dt=new Date(calY,calM,parseInt(this.getAttribute('data-d')));
      if(dt<todayMidnight())return;
      calSel=dt;calDraw();
    });
  });
}
function calInit(){var n=new Date();calY=n.getFullYear();calM=n.getMonth();calDraw();}
function calGetDate(){if(!calSel)return null;return p2(calSel.getDate())+'.'+p2(calSel.getMonth()+1)+'.'+calSel.getFullYear();}
function radioVal(name){var r=document.querySelector('input[name="'+name+'"]:checked');return r?r.value:null;}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2200);}

window.addEventListener('DOMContentLoaded',function(){
  calInit();
  document.getElementById('sbtn').addEventListener('click',function(){

    var route=document.getElementById('t_route').value;
    var date=calGetDate();var time=document.getElementById('t_time').value;
    var seats=radioVal('t_seats');
    var phone=document.getElementById('t_phone').value.trim();
    var com=document.getElementById('t_com').value.trim();
    if(!route)return toast('⚠️ Выберите маршрут');
    if(!date)return toast('⚠️ Выберите дату');
    if(!time)return toast('⚠️ Укажите время');
    if(!seats)return toast('⚠️ Выберите количество мест');
    if(!phone)return toast('⚠️ Укажите телефон');
    tg.sendData(JSON.stringify({type:'trip',route:route,date:date,time:time,seats:seats,phone:phone,comment:com}));

  });
});
</script>
</body>
</html>
